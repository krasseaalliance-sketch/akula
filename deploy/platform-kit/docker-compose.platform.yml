name: akula-platform-staging

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${STAGING_POSTGRES_USER:?STAGING_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?STAGING_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${STAGING_POSTGRES_DB:?STAGING_POSTGRES_DB is required}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STAGING_POSTGRES_USER} -d ${STAGING_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../core
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${STAGING_DATABASE_URL:?STAGING_DATABASE_URL is required}
      REDIS_URL: ${STAGING_REDIS_URL:?STAGING_REDIS_URL is required}
      JWT_SECRET: ${STAGING_JWT_SECRET:?STAGING_JWT_SECRET is required}
      APP_ENV: staging
      APP_MODE: DRY_RUN
      PUBLICATION_MODE: DRY_RUN
      HUNTER_OUTBOUND_DISABLED: "true"
      TELEGRAM_REAL_SEND_ENABLED: "false"
      TELEGRAM_REAL_CONNECT_ENABLED: "false"
      TELEGRAM_DISCOVERY_ENABLED: "false"
      TELEGRAM_HISTORY_SYNC_ENABLED: "false"
      TELEGRAM_LIVE_READ_ENABLED: "false"
      CORS_ORIGINS: https://${STAGING_HOST:?STAGING_HOST is required}
      CORE_ARTIFACT_STORAGE_ROOT: /app/.core_artifacts
      RELEASE_TAG: ${STAGING_RELEASE_TAG:?STAGING_RELEASE_TAG is required}
      BUILD_ID: ${STAGING_BUILD_ID:?STAGING_BUILD_ID is required}
    volumes:
      - staging_artifacts:/app/.core_artifacts
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic -c alembic.ini upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)\""]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ../core/frontend
      dockerfile: Dockerfile
      args:
        APP_BASE_PATH: /scout
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://backend:8000
      NEXT_PUBLIC_APP_BASE_PATH: /scout
      NEXT_PUBLIC_APP_PRODUCT: scout
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      STAGING_HOST: ${STAGING_HOST:?STAGING_HOST is required}
      STAGING_RELEASE_TAG: ${STAGING_RELEASE_TAG:?STAGING_RELEASE_TAG is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - staging_caddy_data:/data
      - staging_caddy_config:/config
    depends_on:
      frontend:
        condition: service_started

volumes:
  staging_postgres_data:
  staging_redis_data:
  staging_artifacts:
  staging_caddy_data:
  staging_caddy_config:
