[project]
name = "lead-hunter-os"
version = "0.1.0"
description = "Multi-tenant lead discovery and campaign operations platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "alembic>=1.14,<2",
  "redis>=5,<6",
  "cryptography>=44,<47",
  "telethon>=1.42,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-ignore = ["B008", "DTZ003", "DTZ011", "UP047"]

[tool.setuptools]
package-dir = {"" = "backend"}
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
